{% extends 'base.html' %}
{% block title %}403 — Access Denied{% endblock %}
{% block content %}
<div class="error-page text-center py-5">
    <div class="error-code">403</div>
    <div class="error-icon mb-3"><i class="bi bi-shield-x"></i></div>
    <h2 class="fw-bold mb-2">Access Denied</h2>
    <p class="text-muted mb-4">You don't have permission to view this page.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4">
        <i class="bi bi-house me-2"></i>Back to Dashboard
    </a>
</div>
{% endblock %}
