{% extends 'base.html' %}
{% block title %}500 — Server Error{% endblock %}
{% block content %}
<div class="error-page text-center py-5">
    <div class="error-code">500</div>
    <div class="error-icon mb-3"><i class="bi bi-exclamation-triangle"></i></div>
    <h2 class="fw-bold mb-2">Something Went Wrong</h2>
    <p class="text-muted mb-4">An unexpected error occurred on our end. Please try again in a moment.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4">
        <i class="bi bi-house me-2"></i>Back to Dashboard
    </a>
</div>
{% endblock %}
